# ============================================================
# Android APK 打包工作流
# 触发：打 tag（v*）或手动 workflow_dispatch
# 产物：Actions Artifacts（30天）+ GitHub Releases（永久）
# ============================================================
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: app
        run: flutter pub get

      - name: 打 Release APK
        working-directory: app
        run: flutter build apk --release --dart-define=USE_MOCK=false --dart-define=API_BASE_URL=https://clothes-sand-theta.vercel.app

      - name: 重命名 APK（带版本号）
        run: cp app/build/app/outputs/flutter-apk/app-release.apk yinian-${{ github.ref_name }}.apk

      - name: 上传 Artifacts（30 天保留）
        uses: actions/upload-artifact@v4
        with:
          name: yinian-apk
          path: yinian-${{ github.ref_name }}.apk
          retention-days: 30

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: yinian-${{ github.ref_name }}.apk
          body: 衣念 ${{ github.ref_name }} 安装包（已连接线上服务）
