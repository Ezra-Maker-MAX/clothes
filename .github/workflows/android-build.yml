# ============================================================
# Android APK 打包工作流
# 触发：打 tag（v*）或手动 workflow_dispatch
# 产物：Actions 运行页 → Artifacts → 下载 dapei-apk
# 说明：Flutter 端代码位于 app/ 目录（第二阶段创建）
# ============================================================
name: Build Android APK

on:
  workflow_dispatch:      # 手动触发：仓库页 Actions → Build Android APK → Run
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags 即打正式包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: app
        run: flutter pub get

      - name: 打 Release APK
        working-directory: app
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: dapei-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
