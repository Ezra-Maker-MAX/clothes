name: dapei_app
description: "「搭配测试」智能穿搭推荐 App —— 懂她、宠她、有分寸地撩她"
publish_to: "none"
version: 0.2.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0            # 第三阶段联调 Vercel API
  image_picker: ^1.1.2    # 选图 + 原生压缩（Android 真正生效，规避 413）
  image: ^4.3.0           # 纯 Dart 兜底压缩：PNG/HEIC/超大图强制压到安全线（Web 端关键）
  shared_preferences: ^2.5.5
  share_plus: ^13.3.1
# 注：path_provider 已移除 —— 最初为「私密照片存本机沙箱」准备，
# 但方案后来改成全量上云（Vercel 私有 Blob + Turso），本地不再需要文件目录访问，
# 零引用依赖留着只会让 pub get 白拉一个包、误导后来人以为有本地存储逻辑。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
